name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Build the aria2 ARM64 binary (cached between runs)
  # ────────────────────────────────────────────────────────────────────────────
  build-aria2:
    name: Build aria2 (ARM64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache aria2 binary
        id: cache-aria2
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/aria2c
          key: aria2-arm64-${{ hashFiles('scripts/build_aria2_android.sh') }}

      - name: Install build dependencies
        if: steps.cache-aria2.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            make cmake curl unzip zip

      - name: Set up Android NDK
        if: steps.cache-aria2.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'ndk;26.3.11579264'

      - name: Build aria2 for ARM64
        if: steps.cache-aria2.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/26.3.11579264"
          bash scripts/build_aria2_android.sh

      - name: Verify binary
        run: |
          file app/src/main/assets/aria2c
          ls -lh app/src/main/assets/aria2c

      - name: Upload aria2c artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2c-arm64
          path: app/src/main/assets/aria2c
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Build the APK and run unit tests
  # ────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build APK & Unit Tests
    runs-on: ubuntu-22.04
    needs: build-aria2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'

      - name: Download aria2c binary
        uses: actions/download-artifact@v4
        with:
          name: aria2c-arm64
          path: app/src/main/assets/

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DownFlow-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Instrumentation tests on emulator (runs on PRs to main only)
  # ────────────────────────────────────────────────────────────────────────────
  instrumentation-tests:
    name: Instrumentation Tests (Emulator)
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            build-tools;35.0.0
            platforms;android-35
            system-images;android-35;google_apis;x86_64
            emulator

      - name: Download aria2c binary
        uses: actions/download-artifact@v4
        with:
          name: aria2c-arm64
          path: app/src/main/assets/

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            --name "DownFlow_Test" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 \
            --force

      - name: Start emulator
        run: |
          $ANDROID_SDK_ROOT/emulator/emulator \
            -avd DownFlow_Test \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect &
          adb wait-for-device
          # Wait for boot to complete
          timeout 300 bash -c \
            'until adb shell getprop sys.boot_completed | grep -m 1 1; do sleep 2; done'

      - name: Run instrumentation tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results
          path: app/build/reports/androidTests/

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Release build (runs on pushes to main only)
  # ────────────────────────────────────────────────────────────────────────────
  release-build:
    name: Assemble Release APK
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'

      - name: Download aria2c binary
        uses: actions/download-artifact@v4
        with:
          name: aria2c-arm64
          path: app/src/main/assets/

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/release.keystore"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DownFlow-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
